[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "ada-topics"
description = "Applied Data Analytics: Topics"
requires-python = ">=3.12"
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: Free for non-commercial use",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [ "pytask" ]
[project.readme]
file = "README.md"
content-type = "text/markdown"
[project.license]
text = "CC-BY-NC-SA-4.0"
[[project.authors]]
name = "Hans-Martin von Gaudecker"
email = "hmgaudecker@gmail.com"
[project.urls]
Documentation = "https://github.com/OpenSourceEconomics/ada_topics"
Github = "https://github.com/OpenSourceEconomics/ada_topics"
Tracker = "https://github.com/OpenSourceEconomics/ada_topics/issues"

[tool.hatch]
version.source = "vcs"
metadata.allow-direct-references = true
build.hooks.vcs.version-file = "src/ada_topics/_version.py"
build.targets.sdist.exclude = [ "tests" ]
build.targets.sdist.only-packages = true
build.targets.wheel.only-include = [ "src" ]
build.targets.wheel.sources = [ "src" ]

[tool.pixi.workspace]
channels = [ "conda-forge" ]
platforms = [ "linux-64", "osx-64", "win-64" ]
[tool.pixi.dependencies]
data-morph-ai = ">=0.2.0,<0.3"
deepdiff = "*"
ipykernel = "*"
ipywidgets = "*"
jupyter-book = ">=1.0.2,<2"
jupyterlab = "*"
mscorefonts = ">=0.0.1,<0.0.2"
nodejs = "*"
openpyxl = "*"
pandas = ">=2.2"
plotly = ">=5.2,<6"
prek = "*"
pyarrow = ">=19.0"
pybaum = "*"
pydata-sphinx-theme = ">=0.13.3"
pygraphviz = "*"
python = ">=3.12.5"
pyyaml = "*"
scipy = "<=1.13"
seaborn = ">=0.13.2,<0.14"
sphinx = "*"
sphinx-automodapi = "*"
sphinx-copybutton = "*"
sphinxcontrib-mermaid = "*"
statsmodels = "*"
xlrd = ">=1.0"
[tool.pixi.pypi-dependencies]
ada_topics = { path = ".", editable = true }
kaleido = "*"
pdbp = "*"
pyperclip = "*"
[tool.pixi.target]
win-64.pypi-dependencies.kaleido = ">=0.1.0.post1,<=0.1.0.post1"

[tool.ruff]
target-version = "py314"
fix = true
unsafe-fixes = false
[tool.ruff.lint]
select = [ "ALL" ]
extend-ignore = [
  "ANN",     # Type annotations
  "B008",    # Function call in default argument
  "B018",    # Useless expression (notebook cell display)
  "BLE001",  # Blind except
  "COM812",  # Conflicts with ruff-format
  "CPY001",  # Copyright notice at top of file
  "D100",    # Missing docstring in public module
  "D103",    # Missing docstring in public function
  "EM101",   # Exception must not use a string literal
  "EM102",   # Exception must not use an f-string literal
  "FBT001",  # Boolean positional argument
  "FIX002",  # Line contains TODO
  "INP001",  # Implicit namespace package
  "ISC001",  # Conflicts with ruff-format
  "N811",    # Constant imported as non-constant
  "N999",    # Invalid module name (week-N directories)
  "PD010",   # .pivot_table preferred to .pivot/.unstack
  "PD013",   # .melt preferred to .stack
  "PD015",   # Use .merge method instead of pd.merge
  "PERF401", # Use a list comprehension
  "PLC2401", # Non-ASCII name
  "PLR0913", # Too many arguments in function definition
  "PLR0917", # Too many positional arguments
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert
  "S110",    # try-except-pass
  "S301",    # pickle module
  "S307",    # Use of eval
  "S602",    # subprocess call with shell=True
  "T201",    # print found
  "TC001",   # Move application import into a type-checking block
  "TC002",   # Move third-party import into a type-checking block
  "TC003",   # Move standard library import into a type-checking block
  "TRY003",  # Long messages outside exception class
]
per-file-ignores."**/*.ipynb" = [
  "B018",    # Useless expression (notebook cell display)
  "E402",    # Module-level import not at top of cell
  "ERA001",  # Commented-out code
  "PLR2004", # Magic value used in comparison
  "T201",    # print found
]
per-file-ignores."src/ada_topics/config.py" = [
  "ERA001", # Commented-out code
]
per-file-ignores."src/ada_topics/python_basics/executing_pytest/screencast/example/test_cobb_douglas.py" = [
  "PLR2004", # Magic value used in comparison
]
per-file-ignores."tests/*" = [
  "INP001", # Implicit namespace package
  "S101",   # Use of assert
]
pydocstyle.convention = "google"

[tool.codespell]
ignore-words-list = "arithmetics,disjointness,fpr,ist,mape,nd,nin,statics"
skip = "*.lock,*.svg,*.bib,*.ipynb"

[tool.pyproject-fmt]
column_width = 88
max_supported_python = "3.14"
table_format = "long"
expand_tables = [
  "tool.pixi.dependencies",
  "tool.pixi.pypi-dependencies",
  "tool.pixi.pypi-dependencies.ada_topics",
  "tool.pixi.target",
  "tool.pixi.target.win-64",
  "tool.pixi.target.win-64.pypi-dependencies",
  "tool.pixi.workspace",
]
collapse_tables = [ "tool.hatch", "tool.pytask", "tool.pytest", "tool.ty" ]

[tool.ty]
# Notebooks are teaching material; ty fights pandas' own stubs there.
src.exclude = [ "**/*.ipynb" ]
# ty resolves third-party imports from this pixi env. The pre-commit hook runs
# ty directly; pixi owns the project environment. Run `pixi install` once.
environment.python = ".pixi/envs/default"
rules.ambiguous-protocol-member = "error"
rules.deprecated = "error"
rules.division-by-zero = "error"
rules.ignore-comment-unknown-rule = "error"
rules.invalid-argument-type = "error"
rules.invalid-ignore-comment = "error"
rules.invalid-return-type = "error"
rules.possibly-missing-attribute = "error"
rules.possibly-missing-implicit-call = "error"
rules.possibly-missing-import = "error"
rules.possibly-unresolved-reference = "error"
rules.redundant-cast = "error"
rules.undefined-reveal = "error"
rules.unresolved-global = "error"
rules.unsupported-base = "error"
rules.unused-ignore-comment = "error"
rules.useless-overload-body = "error"

[tool.pytest]
ini_options.norecursedirs = [ "docs" ]
ini_options.addopts = [ "--pdbcls=pdbp:Pdb" ]
ini_options.filterwarnings = []

[tool.yamlfix]
line_length = 88
none_representation = "null"
sequence_style = "block_style"

[tool.pytask]
ini_options.paths = [ "./src/ada_topics" ]
ini_options.pdbcls = "pdbp:Pdb"
